services:

  # ---------- Base de datos ----------
  # No expone puerto al exterior. Solo los servicios la ven,
  # por la red interna de Docker, usando "postgres" como hostname.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distribuidos
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Service discovery ----------
  # Consul es el registro de servicios. Las instancias se dan de alta solas
  # al arrancar y se borran al apagarse. Consul les hace un health check
  # contra /heartbeat cada 10 segundos.
  # El puerto 8500 se expone para poder abrir su interfaz en el navegador.
  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Servicio A: usuarios (3 instancias) ----------
  usuarios-1:
    build: ./servicio-usuarios
    environment:
      INSTANCIA_ID: usuarios-1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  usuarios-2:
    build: ./servicio-usuarios
    environment:
      INSTANCIA_ID: usuarios-2
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  usuarios-3:
    build: ./servicio-usuarios
    environment:
      INSTANCIA_ID: usuarios-3
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # ---------- Servicio B: tareas (3 instancias) ----------
  tareas-1:
    build: ./servicio-tareas
    environment:
      INSTANCIA_ID: tareas-1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      # Las llamadas entre servicios van al balanceador, no a una instancia.
      USUARIOS_GRPC: nginx:9001
      CATEGORIAS_GRPC: nginx:9003
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  tareas-2:
    build: ./servicio-tareas
    environment:
      INSTANCIA_ID: tareas-2
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      # Las llamadas entre servicios van al balanceador, no a una instancia.
      USUARIOS_GRPC: nginx:9001
      CATEGORIAS_GRPC: nginx:9003
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  tareas-3:
    build: ./servicio-tareas
    environment:
      INSTANCIA_ID: tareas-3
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      # Las llamadas entre servicios van al balanceador, no a una instancia.
      USUARIOS_GRPC: nginx:9001
      CATEGORIAS_GRPC: nginx:9003
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # ---------- Servicio C: categorias (3 instancias) ----------
  categorias-1:
    build: ./servicio-categorias
    environment:
      INSTANCIA_ID: categorias-1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  categorias-2:
    build: ./servicio-categorias
    environment:
      INSTANCIA_ID: categorias-2
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  categorias-3:
    build: ./servicio-categorias
    environment:
      INSTANCIA_ID: categorias-3
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # ---------- Reverse proxy, gateway y load balancer ----------
  # nginx es la unica puerta de entrada al backend. Rutea por el primer
  # segmento de la ruta y balancea con round robin entre las instancias
  # de cada upstream. Tambien reenvia a la API de Consul.
  nginx:
    build: ./nginx
    ports:
      - "8000:8000"   # API HTTP
      - "9001:9001"   # gRPC usuarios
      - "9002:9002"   # gRPC tareas
      - "9003:9003"   # gRPC categorias
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_healthy
      usuarios-1:
        condition: service_started
      usuarios-2:
        condition: service_started
      usuarios-3:
        condition: service_started
      tareas-1:
        condition: service_started
      tareas-2:
        condition: service_started
      tareas-3:
        condition: service_started
      categorias-1:
        condition: service_started
      categorias-2:
        condition: service_started
      categorias-3:
        condition: service_started

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx

volumes:
  datos_postgres:
