services:

  # ---------- Base de datos ----------
  # No expone puerto al exterior. Solo los servicios la ven,
  # por la red interna de Docker, usando "postgres" como hostname.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distribuidos
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Service discovery ----------
  # Consul es el registro de servicios. Las instancias se dan de alta solas
  # al arrancar y se borran al apagarse. Consul les hace un health check
  # contra /heartbeat cada 10 segundos.
  # El puerto 8500 se expone para poder abrir su interfaz en el navegador.
  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10


  # ---------- Cola de mensajeria ----------
  # Kafka en modo KRaft: un solo nodo que hace de broker y de controlador,
  # sin Zookeeper. No expone puerto al host, solo se usa desde la red
  # interna. El heap va limitado para no comerse la memoria de la laptop.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Los listeners se atan al nombre del contenedor, no a 0.0.0.0.
      # Kafka anuncia el listener del controlador tal como se declara aqui,
      # y 0.0.0.0 no es una direccion anunciable.
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---------- Consumidor de las colas ----------
  # Crea los tres topicos, se suscribe a ellos y guarda los ultimos eventos.
  # Es el unico que espera a que Kafka este listo; los demas servicios
  # arrancan sin esperarlo, porque publicar es asincrono.
  auditoria:
    build: ./servicio-auditoria
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Servicio A: usuarios (3 instancias) ----------
  usuarios-1:
    build: ./servicio-usuarios
    environment:
      INSTANCIA_ID: usuarios-1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  usuarios-2:
    build: ./servicio-usuarios
    environment:
      INSTANCIA_ID: usuarios-2
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  usuarios-3:
    build: ./servicio-usuarios
    environment:
      INSTANCIA_ID: usuarios-3
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # ---------- Servicio B: tareas (3 instancias) ----------
  tareas-1:
    build: ./servicio-tareas
    environment:
      INSTANCIA_ID: tareas-1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
      # Las llamadas entre servicios van al balanceador, no a una instancia.
      USUARIOS_GRPC: nginx:9001
      CATEGORIAS_GRPC: nginx:9003
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  tareas-2:
    build: ./servicio-tareas
    environment:
      INSTANCIA_ID: tareas-2
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
      # Las llamadas entre servicios van al balanceador, no a una instancia.
      USUARIOS_GRPC: nginx:9001
      CATEGORIAS_GRPC: nginx:9003
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  tareas-3:
    build: ./servicio-tareas
    environment:
      INSTANCIA_ID: tareas-3
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
      # Las llamadas entre servicios van al balanceador, no a una instancia.
      USUARIOS_GRPC: nginx:9001
      CATEGORIAS_GRPC: nginx:9003
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # ---------- Servicio C: categorias (3 instancias) ----------
  categorias-1:
    build: ./servicio-categorias
    environment:
      INSTANCIA_ID: categorias-1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  categorias-2:
    build: ./servicio-categorias
    environment:
      INSTANCIA_ID: categorias-2
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  categorias-3:
    build: ./servicio-categorias
    environment:
      INSTANCIA_ID: categorias-3
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distribuidos?sslmode=disable
      CONSUL_URL: http://consul:8500
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # ---------- Reverse proxy, gateway y load balancer ----------
  # nginx es la unica puerta de entrada al backend. Rutea por el primer
  # segmento de la ruta y balancea con round robin entre las instancias
  # de cada upstream. Tambien reenvia a la API de Consul.
  nginx:
    build: ./nginx
    ports:
      - "8000:8000"   # API HTTP
      - "9001:9001"   # gRPC usuarios
      - "9002:9002"   # gRPC tareas
      - "9003:9003"   # gRPC categorias
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_healthy
      usuarios-1:
        condition: service_started
      usuarios-2:
        condition: service_started
      usuarios-3:
        condition: service_started
      tareas-1:
        condition: service_started
      tareas-2:
        condition: service_started
      tareas-3:
        condition: service_started
      categorias-1:
        condition: service_started
      categorias-2:
        condition: service_started
      categorias-3:
        condition: service_started
      auditoria:
        condition: service_started

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx

volumes:
  datos_postgres:
