events {
    worker_connections 1024;
}

http {
    # Un upstream es un pool de instancias del mismo servicio.
    # nginx reparte las peticiones entre ellas con round robin, que es su
    # algoritmo por defecto.
    #
    # max_fails y fail_timeout son el health check pasivo de nginx: si una
    # instancia falla una peticion, nginx deja de mandarle trafico durante
    # 10 segundos y despues la vuelve a intentar.

    upstream usuarios {
        server usuarios-1:8080 max_fails=1 fail_timeout=10s;
        server usuarios-2:8080 max_fails=1 fail_timeout=10s;
        server usuarios-3:8080 max_fails=1 fail_timeout=10s;
    }

    upstream tareas {
        server tareas-1:8080 max_fails=1 fail_timeout=10s;
        server tareas-2:8080 max_fails=1 fail_timeout=10s;
        server tareas-3:8080 max_fails=1 fail_timeout=10s;
    }

    upstream categorias {
        server categorias-1:8080 max_fails=1 fail_timeout=10s;
        server categorias-2:8080 max_fails=1 fail_timeout=10s;
        server categorias-3:8080 max_fails=1 fail_timeout=10s;
    }

    # Formato de log que incluye a que instancia se reenvio cada peticion.
    # Sirve para ver el balanceo en vivo con: docker compose logs -f nginx
    log_format balanceo '$request -> $upstream_addr ($status)';
    access_log /var/log/nginx/access.log balanceo;

    server {
        listen 8000;

        # El frontend corre en el puerto 3000, otro origen, asi que el
        # navegador necesita permiso explicito para llamar aqui.
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Content-Type" always;
        add_header Access-Control-Expose-Headers "X-Instancia" always;

        # El navegador manda un OPTIONS antes de un PUT o DELETE con JSON.
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # El primer segmento de la ruta decide el servicio.
        # Dentro del servicio, el upstream decide la instancia.
        location /usuarios {
            proxy_pass http://usuarios;
        }

        location /tareas {
            proxy_pass http://tareas;
        }

        location /categorias {
            proxy_pass http://categorias;
        }

        # El frontend consulta el registro de servicios aqui. nginx reenvia
        # a la API de Consul para no tener que exponer Consul al navegador
        # ni lidiar con CORS por separado.
        location /consul/ {
            proxy_pass http://consul:8500/;
        }

        location = /salud {
            return 200 "nginx ok\n";
        }
    }
}
