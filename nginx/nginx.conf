events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # Upstreams HTTP (puerto 8080 de cada instancia)
    # ------------------------------------------------------------------
    # Un upstream es un pool de instancias del mismo servicio.
    # nginx reparte las peticiones entre ellas con round robin, que es su
    # algoritmo por defecto.
    #
    # max_fails y fail_timeout son el health check pasivo de nginx: si una
    # instancia falla una peticion, nginx deja de mandarle trafico durante
    # 10 segundos y despues la vuelve a intentar.

    upstream usuarios {
        server usuarios-1:8080 max_fails=1 fail_timeout=10s;
        server usuarios-2:8080 max_fails=1 fail_timeout=10s;
        server usuarios-3:8080 max_fails=1 fail_timeout=10s;
    }

    upstream tareas {
        server tareas-1:8080 max_fails=1 fail_timeout=10s;
        server tareas-2:8080 max_fails=1 fail_timeout=10s;
        server tareas-3:8080 max_fails=1 fail_timeout=10s;
    }

    upstream categorias {
        server categorias-1:8080 max_fails=1 fail_timeout=10s;
        server categorias-2:8080 max_fails=1 fail_timeout=10s;
        server categorias-3:8080 max_fails=1 fail_timeout=10s;
    }

    # ------------------------------------------------------------------
    # Upstreams gRPC (puerto 9090 de cada instancia)
    # ------------------------------------------------------------------
    # Mismas instancias, otro protocolo. El balanceo es igual de round
    # robin: nginx reparte las llamadas gRPC entre las tres.

    upstream usuarios_grpc {
        server usuarios-1:9090 max_fails=1 fail_timeout=10s;
        server usuarios-2:9090 max_fails=1 fail_timeout=10s;
        server usuarios-3:9090 max_fails=1 fail_timeout=10s;
    }

    upstream tareas_grpc {
        server tareas-1:9090 max_fails=1 fail_timeout=10s;
        server tareas-2:9090 max_fails=1 fail_timeout=10s;
        server tareas-3:9090 max_fails=1 fail_timeout=10s;
    }

    upstream categorias_grpc {
        server categorias-1:9090 max_fails=1 fail_timeout=10s;
        server categorias-2:9090 max_fails=1 fail_timeout=10s;
        server categorias-3:9090 max_fails=1 fail_timeout=10s;
    }

    # El consumidor de Kafka. Solo hay una instancia, asi que aqui no hay
    # nada que balancear, pero igual pasa por el proxy para que el frontend
    # siga conociendo una sola direccion.
    upstream auditoria {
        server auditoria:8080;
    }

    # Formato de log que incluye a que instancia se reenvio cada peticion.
    # Sirve para ver el balanceo en vivo con: docker compose logs -f nginx
    log_format balanceo '$request -> $upstream_addr ($status)';
    access_log /var/log/nginx/access.log balanceo;

    # ------------------------------------------------------------------
    # Puerto 8000: API HTTP, la que usa el navegador
    # ------------------------------------------------------------------
    server {
        listen 8000;

        # El frontend corre en el puerto 3000, otro origen, asi que el
        # navegador necesita permiso explicito para llamar aqui.
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Content-Type" always;
        add_header Access-Control-Expose-Headers "X-Instancia" always;

        # El navegador manda un OPTIONS antes de un PUT o DELETE con JSON.
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # El primer segmento de la ruta decide el servicio.
        # Dentro del servicio, el upstream decide la instancia.
        location /usuarios {
            proxy_pass http://usuarios;
        }

        location /tareas {
            proxy_pass http://tareas;
        }

        location /categorias {
            proxy_pass http://categorias;
        }

        # El frontend consulta el registro de servicios aqui. nginx reenvia
        # a la API de Consul para no tener que exponer Consul al navegador
        # ni lidiar con CORS por separado.
        location /consul/ {
            proxy_pass http://consul:8500/;
        }

        # Eventos consumidos de las colas de Kafka.
        location /eventos {
            proxy_pass http://auditoria;
        }

        location = /salud {
            return 200 "nginx ok\n";
        }
    }

    # ------------------------------------------------------------------
    # Puertos 9001, 9002 y 9003: API gRPC
    # ------------------------------------------------------------------
    # gRPC va sobre HTTP/2, por eso cada bloque lo activa, y el reenvio se
    # hace con grpc_pass en lugar de proxy_pass.
    #
    # Se usa un puerto por servicio para que grpcurl pueda descubrir los
    # metodos por reflexion sin ambiguedad: la reflexion no dice a que
    # servicio pertenece la llamada, asi que lo dice el puerto.

    server {
        listen 9001;
        http2 on;
        location / {
            grpc_pass grpc://usuarios_grpc;
        }
    }

    server {
        listen 9002;
        http2 on;
        location / {
            grpc_pass grpc://tareas_grpc;
        }
    }

    server {
        listen 9003;
        http2 on;
        location / {
            grpc_pass grpc://categorias_grpc;
        }
    }
}
